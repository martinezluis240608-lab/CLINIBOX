<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración de tienda | CliniBox</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/administador_tienda.css?v=20261123.2">
    <link rel="stylesheet" href="../assets/css/store-admin-local.css?v=20261123.7">
    <script src="../assets/js/store-admin-local.js?v=20261123.8" defer></script>
</head>
<body class="admin-body" data-store-admin-app>
<div class="admin-shell">
    <aside class="admin-sidebar">
        <a class="admin-brand" href="#home" aria-label="CliniBox, inicio de tienda">
            <span class="admin-brand-mark" aria-hidden="true">C</span>
            <span class="admin-brand-copy"><strong>CliniBox</strong><small>TIENDA</small></span>
        </a>
        <div class="admin-nav-caption">TIENDA</div>
        <nav class="admin-nav" aria-label="Menú de la tienda" data-store-nav></nav>
        <div class="admin-sidebar-spacer"></div>
        <div class="admin-profile">
            <span class="admin-avatar" aria-hidden="true">C</span>
            <span class="admin-profile-copy"><strong>CliniBox</strong><small>Datos guardados en este navegador</small></span>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-content">
            <header class="admin-topbar">
                <div class="admin-breadcrumb"><span>CliniBox</span><span class="admin-breadcrumb-separator">/</span><span data-page-breadcrumb>Inicio</span></div>
                <div class="admin-topbar-actions"><span class="admin-live-status"><i></i> Modo local</span><time class="admin-topbar-date" data-current-date></time></div>
            </header>
            <div class="admin-alert alert-error" role="alert" data-page-feedback hidden></div>
            <div data-module-root aria-live="polite"><div class="admin-empty-inline"><strong>Abriendo la tienda...</strong></div></div>
        </div>
    </main>
</div>
<noscript>Activa JavaScript para usar la administración local de la tienda.</noscript>
</body>
</html>
