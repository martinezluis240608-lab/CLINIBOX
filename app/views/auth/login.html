<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Paciente | CliniBox</title>
  <link rel="stylesheet" href="../../style.css?v=20260913-3">
  <style>
    .portal-login-page {
      --login-primary: #6d5ef7;
      --login-secondary: #ff4fa3;
      --login-cyan: #1cc8ff;
      --login-success: #3ad39f;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 79, 163, 0.25), transparent 18%),
        radial-gradient(circle at bottom right, rgba(28, 200, 255, 0.28), transparent 22%),
        linear-gradient(135deg, #f1f5ff 0%, #fdf4fb 38%, #eef9ff 100%);
    }

    .portal-login-page::before,
    .portal-login-page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.8;
      z-index: 0;
    }

    .portal-login-page::before {
      width: 260px;
      height: 260px;
      background: rgba(109, 94, 247, 0.22);
      top: 8%;
      left: 10%;
    }

    .portal-login-page::after {
      width: 300px;
      height: 300px;
      background: rgba(255, 79, 163, 0.18);
      right: 8%;
      bottom: 6%;
    }

    .portal-login-page .login-wrapper {
      max-width: 470px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .login-card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      padding: 30px 28px 24px;
      box-shadow:
        0 30px 70px rgba(109, 94, 247, 0.16),
        0 18px 36px rgba(255, 79, 163, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--login-secondary), var(--login-primary), var(--login-cyan), var(--login-success));
    }

    .login-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--login-primary), var(--login-secondary), var(--login-cyan));
      color: #fff;
      box-shadow: 0 12px 28px rgba(109, 94, 247, 0.35);
    }

    .login-logo svg {
      width: 34px;
      height: 34px;
    }

    .login-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 2vw, 2.4rem);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #1d2b4f;
    }

    .login-header p {
      margin: 0;
      color: #5b6884;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .form-group label {
      color: #24314d;
      font-size: 0.83rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #7582a8;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 14px 44px 14px 42px;
      border: 1.5px solid rgba(148, 163, 184, 0.7);
      border-radius: 14px;
      background: rgba(248, 250, 255, 0.9);
      color: #1f2937;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .form-group input:focus {
      border-color: var(--login-primary);
      box-shadow: 0 0 0 4px rgba(109, 94, 247, 0.12);
      background: #ffffff;
      outline: none;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 10px;
      background: rgba(109, 94, 247, 0.08);
      cursor: pointer;
      font-size: 1rem;
      color: #4f5e84;
      transition: all 0.2s ease;
    }

    .btn-toggle-pwd:hover {
      background: rgba(109, 94, 247, 0.14);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      margin-top: -2px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #57657f;
      cursor: pointer;
      line-height: 1.4;
    }

    .remember-label input {
      accent-color: var(--login-primary);
      width: 15px;
      height: 15px;
    }

    .link-btn {
      background: transparent;
      border: none;
      color: var(--login-primary);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      padding: 0;
      font-size: 0.8rem;
    }

    .link-btn:hover {
      color: var(--login-secondary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border: none;
      border-radius: 999px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4fa3 0%, #7d5cf4 48%, #1cc8ff 100%);
      color: #fff;
      box-shadow: 0 14px 28px rgba(124, 92, 244, 0.32);
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 18px 34px rgba(124, 92, 244, 0.42);
    }

    .btn-block {
      width: 100%;
    }

    .btn-large {
      padding: 15px 26px;
      font-size: 1rem;
    }

    .demo-credentials-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px dashed rgba(109, 94, 247, 0.5);
      background: linear-gradient(135deg, rgba(109, 94, 247, 0.06), rgba(255, 79, 163, 0.06));
      color: #495a7a;
      font-size: 0.78rem;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
    }

    .demo-credentials-box strong {
      display: block;
      margin-bottom: 6px;
      color: #2b3b5b;
      font-weight: 800;
    }

    .demo-credentials-box code {
      display: block;
      color: #4735b6;
      font-weight: 700;
      word-break: break-word;
    }

    .login-footer {
      margin-top: 18px;
      text-align: center;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.6);
      border: 1.5px solid rgba(109, 94, 247, 0.22);
      color: #344366;
      padding: 8px 14px;
      font-size: 0.8rem;
      border-radius: 999px;
    }

    .btn-outline:hover {
      border-color: rgba(109, 94, 247, 0.5);
      background: rgba(109, 94, 247, 0.04);
      color: #2b3b5b;
    }

    @media (max-width: 480px) {
      .portal-login-page {
        padding: 16px;
      }

      .login-card {
        padding: 24px 18px 20px;
      }

      .login-options {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="portal-login-page">
  <main class="login-wrapper" aria-labelledby="login-title">
    <section class="login-card glass-panel">
      <header class="login-header">
        <div class="login-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 6v12m-6-6h12"/></svg>
        </div>
        <h1 id="login-title">Portal del Paciente</h1>
        <p>Ingresa tus credenciales para acceder a tus servicios de salud</p>
      </header>

      <form class="login-form" action="login" method="post">
        <input type="hidden" name="role" value="paciente">
        <div class="form-group">
          <label for="loginEmail">Correo Electrónico</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="loginEmail" name="email" value="paciente@clinibox.com" placeholder="ejemplo@clinibox.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" name="password" value="123456" placeholder="••••••••" required>
            <button type="button" class="btn-toggle-pwd" id="btnTogglePassword" aria-label="Mostrar contraseña">👁️</button>
          </div>
        </div>
        <div class="login-options">
          <label class="remember-label"><input type="checkbox" name="recordarme" checked> Recordarme en este equipo</label>
          <button type="button" class="link-btn" disabled>¿Olvidaste tu contraseña?</button>
        </div>
        <button type="submit" class="btn btn-primary btn-large btn-block">
          <span>Iniciar sesión</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </button>
      </form>

      <aside class="demo-credentials-box">
        <strong>Credenciales de demostración:</strong>
        <code>Correo: paciente@clinibox.com | Clave: 123456</code>
      </aside>
      <footer class="login-footer"><a class="btn btn-outline btn-sm" href="../../index.html">← Volver al recorrido</a></footer>
    </section>
  </main>
  <script>
    document.getElementById('btnTogglePassword').addEventListener('click', function () {
      const input = document.getElementById('loginPassword');
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      this.textContent = visible ? '👁️' : '🙈';
    });
  </script>
</body>
</html>
