<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pacientes | CliniBox</title>
<link rel="stylesheet" href="/CLINIBOX/public/assets/css/pacientes.css">

<link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3">
<script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script>
    <link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5">
    <script src="/CLINIBOX/public/assets/js/page-size.js?v=1" defer></script>
</head>
<body>
<div class="app-shell">
    <!-- MENÚ LATERAL -->
    <nav class="sidebar">
        <clinibox-profile-menu data-label="Panel médico" data-profile="medico/perfil"></clinibox-profile-menu>
        <div class="nav-list">
            <a href="/CLINIBOX/public/medico/pacientes" class="active">Pacientes</a>
            <a href="/CLINIBOX/public/medico/agenda">Agenda</a>
            <a href="/CLINIBOX/public/medico/consultas">Consultas</a>
            <a href="/CLINIBOX/public/medico/expedientes">Expedientes</a>
            <a href="/CLINIBOX/public/medico/recetas">Recetas</a>
            <a href="/CLINIBOX/public/medico/mensajes">Mensajes</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div class="header-row">
            <section class="section-header">
                <p class="eyebrow">Módulo médico</p>
                <h2>Gestión de pacientes</h2>
                <p>Pacientes con citas registradas contigo.</p>
            </section>
            
        </div>

        <!-- BARRA DE BÚSQUEDA Y TOTAL -->
        <div class="table-toolbar">
            <div class="search-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" class="search-input" id="searchPatient" placeholder="Buscar por nombre, expediente o teléfono..." oninput="filterPatients()">
            </div>
            <span class="counter-badge" id="patientCounter">Cargando pacientes...</span>
        </div>

        <!-- TABLA DINÁMICA DE PACIENTES -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Paciente / Expediente</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Última consulta</th>
                        <th style="text-align: right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <!-- Filas inyectadas dinámicamente con JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- ==========================================================
     MODAL PARA AGREGAR / EDITAR PACIENTE
========================================================== -->
<div class="modal-overlay" id="viewModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Expediente del Paciente</h3>
            <button class="close-btn" onclick="closeViewModal()">&times;</button>
        </div>
        <div class="modal-body" id="viewModalContent">
            <!-- Datos inyectados con JavaScript -->
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeViewModal()">Cerrar</button>
        </div>
    </div>
</div>

<!-- ==========================================================
     LISTADO DE PACIENTES VINCULADOS EN BASE DE DATOS
========================================================== -->
<script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script>
<script>
let patients = [];
const escapePatient = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function formatDate(value) { if (!value) return 'Sin consultas'; const date = String(value).slice(0, 10); const parts = date.split('-'); return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : date; }
function renderPatients() {
  const term = document.getElementById('searchPatient').value.trim().toLocaleLowerCase('es-MX');
  const filtered = patients.filter(patient => `${patient.name} ${patient.exp} ${patient.phone} ${patient.email}`.toLocaleLowerCase('es-MX').includes(term));
  document.getElementById('patientCounter').textContent = `${filtered.length} paciente${filtered.length === 1 ? '' : 's'}`;
  document.getElementById('patientTableBody').innerHTML = filtered.map(patient => `<tr>
    <td><strong>${escapePatient(patient.name)}</strong><br><small>#${escapePatient(patient.exp)}</small></td>
    <td>${escapePatient(patient.phone || 'Sin teléfono')}</td><td>${escapePatient(patient.email)}</td>
    <td>${formatDate(patient.last_visit)}</td>
    <td style="text-align:right"><button class="btn-action btn-view" type="button" onclick="viewPatient(${Number(patient.id)})">Ver ficha</button></td>
  </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;padding:30px">No hay pacientes registrados para mostrar.</td></tr>`;
}
function filterPatients() { renderPatients(); }
function viewPatient(id) {
  const patient = patients.find(item => Number(item.id) === Number(id));
  if (!patient) return;
  document.getElementById('viewModalContent').innerHTML = `<h4>${escapePatient(patient.name)}</h4><p>Expediente: ${escapePatient(patient.exp)}</p><p>Correo: ${escapePatient(patient.email)}</p><p>Teléfono: ${escapePatient(patient.phone || 'No registrado')}</p><p>Última consulta: ${formatDate(patient.last_visit)}</p>`;
  document.getElementById('viewModal').classList.add('active');
}
function closeViewModal() { document.getElementById('viewModal').classList.remove('active'); }
(async function loadPatients() {
  const counter = document.getElementById('patientCounter');
  try { const data = await clinicApi('patients'); patients = data.patients || []; renderPatients(); }
  catch (error) { counter.textContent = error.message; document.getElementById('patientTableBody').innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px">No se pudo cargar la lista de pacientes.</td></tr>`; }
})();
</script>
<!-- MODAL CERRAR SESIÓN -->

</body>
</html>
