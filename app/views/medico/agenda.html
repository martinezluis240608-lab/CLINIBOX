<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda médica | CliniBox</title>
<link rel="stylesheet" href="/CLINIBOX/public/assets/css/agenda.css">
<link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3">
<link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5">
<script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script>
</head>
<body>
<div class="app-shell">
<nav class="sidebar">
  <clinibox-profile-menu data-label="Panel médico" data-profile="medico/perfil"></clinibox-profile-menu>
  <div class="nav-list"><a href="/CLINIBOX/public/medico/pacientes">Pacientes</a><a href="/CLINIBOX/public/medico/agenda" class="active">Agenda</a><a href="/CLINIBOX/public/medico/consultas">Consultas</a><a href="/CLINIBOX/public/medico/expedientes">Expedientes</a><a href="/CLINIBOX/public/medico/recetas">Recetas</a><a href="/CLINIBOX/public/medico/mensajes">Mensajes</a></div>
</nav>
<main class="main-content">
  <div class="header-row"><section class="section-header"><p class="eyebrow">Módulo médico</p><h2>Agenda de citas</h2><p id="doctorLabel">Tus citas registradas.</p></section><button class="btn-primary" type="button" onclick="openAppointmentModal()">＋ Agendar cita</button></div>
  <div class="table-toolbar"><div class="search-wrapper"><input class="search-input" id="agendaSearch" type="search" placeholder="Buscar paciente o motivo" oninput="renderAppointments()"></div><span class="counter-badge" id="agendaCount">Cargando citas…</span></div>
  <div class="table-wrapper"><table><thead><tr><th>Fecha y hora</th><th>Paciente</th><th>Motivo</th><th>Modalidad</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="agendaBody"><tr><td colspan="6">Cargando…</td></tr></tbody></table></div>
</main>
</div>
<div class="modal-overlay" id="appointmentModal"><div class="modal-card"><div class="modal-header"><h3>Agendar cita</h3><button class="close-btn" type="button" onclick="closeModal()">&times;</button></div>
<form id="appointmentForm" onsubmit="saveAppointment(event)"><div class="modal-body">
  <div class="form-group"><label for="appPatient">Paciente registrado *</label><select id="appPatient" class="form-control" required><option value="">Selecciona un paciente</option></select></div>
  <div class="form-group"><label for="appDate">Fecha *</label><input type="date" id="appDate" class="form-control" required></div>
  <div class="form-group"><label for="appTime">Hora *</label><input type="time" id="appTime" class="form-control" required></div>
  <div class="form-group"><label for="appType">Modalidad</label><select id="appType" class="form-control"><option value="Presencial">Presencial</option><option value="Virtual">Virtual</option></select></div>
  <div class="form-group"><label for="appReason">Motivo *</label><input type="text" id="appReason" class="form-control" maxlength="255" required></div>
</div><div class="modal-footer"><button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-primary">Guardar cita</button></div></form></div></div>
<script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script>
<script>
let appointments=[];let agendaPatients=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dateLabel=value=>{const [y,m,d]=String(value||'').slice(0,10).split('-');return y?`${d}/${m}/${y}`:'';};
function renderAppointments(){const term=document.getElementById('agendaSearch').value.trim().toLocaleLowerCase('es-MX');const rows=appointments.filter(a=>`${a.patient} ${a.reason}`.toLocaleLowerCase('es-MX').includes(term));document.getElementById('agendaCount').textContent=`${rows.length} cita${rows.length===1?'':'s'}`;document.getElementById('agendaBody').innerHTML=rows.map(a=>`<tr><td>${dateLabel(a.date)} · ${esc(a.time)}</td><td>${esc(a.patient)}</td><td>${esc(a.reason)}</td><td>${esc(a.type)}</td><td>${esc(a.status)}</td><td><button class="btn-action btn-edit" onclick="toggleStatus(${Number(a.id)})">Avanzar estado</button> <button class="btn-action btn-delete" onclick="deleteAppointment(${Number(a.id)})">Cancelar</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:28px">No hay citas registradas.</td></tr>';}
function openAppointmentModal(){document.getElementById('appointmentForm').reset();document.getElementById('appDate').min=new Date().toISOString().slice(0,10);document.getElementById('appointmentModal').classList.add('active');}
function closeModal(){document.getElementById('appointmentModal').classList.remove('active');}
async function refreshAppointments(){const data=await clinicApi('appointments');appointments=data.appointments||[];renderAppointments();}
async function saveAppointment(event){event.preventDefault();const payload={action:'appointment',patient_id:Number(document.getElementById('appPatient').value),date:document.getElementById('appDate').value,time:document.getElementById('appTime').value,type:document.getElementById('appType').value,reason:document.getElementById('appReason').value.trim()};try{await clinicApi('',payload);await refreshAppointments();closeModal();}catch(error){alert(error.message);}}
async function toggleStatus(id){const a=appointments.find(item=>Number(item.id)===Number(id));if(!a)return;const next=a.status==='Confirmada'?'En atención':a.status==='En atención'?'Completada':null;if(!next)return;try{await clinicApi('',{action:'consultation_update',id:Number(a.id),patient_id:Number(a.paciente_id),date:a.date,time:a.time,type:a.type,status:next,reason:a.reason,diagnosis:a.diagnosis||'',notes:a.notas||''});await refreshAppointments();}catch(error){alert(error.message);}}
async function deleteAppointment(id){const a=appointments.find(item=>Number(item.id)===Number(id));if(!a||!confirm(`¿Cancelar la cita de ${a.patient}?`))return;try{await clinicApi('',{action:'consultation_update',id:Number(a.id),patient_id:Number(a.paciente_id),date:a.date,time:a.time,type:a.type,status:'Cancelada',reason:a.reason,diagnosis:a.diagnosis||'',notes:a.notas||''});await refreshAppointments();}catch(error){alert(error.message);}}
(async function initAgenda(){try{const [patients,profile]=await Promise.all([clinicApi('patients'),clinicApi('profile')]);agendaPatients=patients.patients||[];document.getElementById('appPatient').innerHTML='<option value="">Selecciona un paciente</option>'+agendaPatients.map(p=>`<option value="${Number(p.id)}">${esc(p.name)} · ${esc(p.exp)}</option>`).join('');if(profile.profile?.name)document.getElementById('doctorLabel').textContent=`Agenda de ${profile.profile.name}.`;await refreshAppointments();}catch(error){document.getElementById('agendaBody').innerHTML=`<tr><td colspan="6" style="text-align:center;padding:28px">${esc(error.message)}</td></tr>`;document.getElementById('agendaCount').textContent='No disponible';}})();
</script>
</body></html>
