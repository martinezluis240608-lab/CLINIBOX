<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultas Virtuales | CliniBox</title>
<link rel="stylesheet" href="/CLINIBOX/public/assets/css/mensajes.css">

<link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3">
<script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script>
    <link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5">
    <script src="/CLINIBOX/public/assets/js/page-size.js?v=1" defer></script>
</head>
<body>
<div class="app-shell">
    <!-- BARRA LATERAL -->
    <nav class="sidebar">
        <clinibox-profile-menu data-label="Panel médico" data-profile="medico/perfil"></clinibox-profile-menu>
        <div class="nav-list">
            <a href="/CLINIBOX/public/medico/pacientes">Pacientes</a>
            <a href="/CLINIBOX/public/medico/agenda">Agenda</a>
            <a href="/CLINIBOX/public/medico/consultas">Consultas</a>
            <a href="/CLINIBOX/public/medico/expedientes">Expedientes</a>
            <a href="/CLINIBOX/public/medico/recetas">Recetas</a>
            <a href="/CLINIBOX/public/medico/mensajes" class="active">Mensajes</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <section class="section-header">
            <p class="eyebrow">Módulo médico</p>
            <h2>Consultas virtuales y mensajería</h2>
            <p>Atiende dudas de seguimiento y comunicación directa con tus pacientes.</p>
        </section>

        <!-- LAYOUT DE CHAT -->
        <div class="chat-layout">
            <!-- BANDEJA DE PACIENTES -->
            <div class="chat-inbox">
                <div class="inbox-header">
                    <input type="text" class="inbox-search" id="searchInbox" placeholder="Buscar paciente en mensajes..." oninput="filterInbox()">
                </div>
                <div class="patient-conversations-list" id="conversationsContainer">
                    <!-- Conversaciones inyectadas dinámicamente -->
                </div>
            </div>

            <!-- VENTANA DEL CHAT ACTIVO -->
            <div class="chat-window">
                <div class="chat-header">
                    <div class="chat-patient-meta">
                        <h4 id="activeChatName">Carlos Mendoza</h4>
                        <span id="activeChatStatus">En línea &bull; Exp. #EXP-084</span>
                    </div>
                    <a href="expedientes.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 600;">
                        Ver Expediente &rarr;
                    </a>
                </div>

                <!-- HISTORIAL DE MENSAJES -->
                <div class="chat-messages-area" id="messagesArea">
                    <!-- Burbujas inyectadas con JavaScript -->
                </div>

                <!-- PLANTILLAS DE RESPUESTAS MÉDICAS RÁPIDAS -->
                <div class="quick-replies">
                    <button class="quick-chip" onclick="useQuickReply('Sí, tómalo con abundante agua después de tus alimentos.')">💧 Tomar con alimentos</button>
                    <button class="quick-chip" onclick="useQuickReply('Tómalo preferentemente en ayunas, 30 minutos antes del desayuno.')">🍳 Tomar en ayunas</button>
                    <button class="quick-chip" onclick="useQuickReply('Si las molestias persisten más de 24 horas, agenda una consulta presencial.')">📅 Revisión presencial</button>
                    <button class="quick-chip" onclick="useQuickReply('Continúa con la dosis indicada en tu receta.')">💊 Mantener dosis</button>
                </div>

                <!-- FORMULARIO DE ENVÍO -->
                <form class="chat-input-bar" onsubmit="sendMessage(event)">
                    <input type="text" id="messageInput" class="chat-input" placeholder="Escribe tu respuesta a Carlos Mendoza..." autocomplete="off" required>
                    <button type="submit" class="btn-send">
                        <span>Enviar</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<!-- ==========================================================
     LÓGICA JAVASCRIPT: BANDEJA INTERACTIVA Y CHAT
========================================================== -->
<script>
    const defaultConversations = [
        {
            id: 1,
            patient: "Carlos Mendoza",
            exp: "EXP-084",
            unread: true,
            messages: [
                { sender: "doctor", text: "Buenos días Carlos, ¿cómo te has sentido con el nuevo tratamiento?", time: "09:12 AM" },
                { sender: "patient", text: "¿Puedo tomar el medicamento después de comer?", time: "Hace 10 min" }
            ]
        },
        {
            id: 2,
            patient: "Mariana Morales Rivas",
            exp: "EXP-085",
            unread: false,
            messages: [
                { sender: "patient", text: "Doctora, ya me realicé la química sanguínea de control. En cuanto tenga los resultados se los comparto.", time: "Ayer" },
                { sender: "doctor", text: "Perfecto Mariana, quedo atenta para revisar tus parámetros de glucosa.", time: "Ayer" }
            ]
        },
        {
            id: 3,
            patient: "Roberto Sánchez Gómez",
            exp: "EXP-086",
            unread: false,
            messages: [
                { sender: "patient", text: "Muchas gracias doctora, el dolor lumbar ha disminuido bastante con el calor local.", time: "Hace 2 días" },
                { sender: "doctor", text: "Excelente noticia Roberto, no olvides evitar levantar peso excesivo.", time: "Hace 2 días" }
            ]
        }
    ];

    let chatsData = JSON.parse(localStorage.getItem('clinibox_chats')) || defaultConversations;
    let activeChatId = 1;

    function saveStorage() {
        localStorage.setItem('clinibox_chats', JSON.stringify(chatsData));
    }

    function renderInbox(filtered = null) {
        const container = document.getElementById('conversationsContainer');
        container.innerHTML = '';

        const list = filtered || chatsData;

        list.forEach(c => {
            const lastMsg = c.messages[c.messages.length - 1];
            const initials = c.patient.split(' ').map(n => n[0]).slice(0, 2).join('');

            const item = document.createElement('div');
            item.className = `conv-item ${c.id === activeChatId ? 'active' : ''}`;
            item.onclick = () => selectChat(c.id);

            item.innerHTML = `
                <div class="patient-avatar">${initials}</div>
                <div class="conv-info">
                    <div class="conv-top">
                        <strong>${c.patient}</strong>
                        <span>${lastMsg ? lastMsg.time : ''}</span>
                    </div>
                    <p class="conv-preview">${lastMsg ? (lastMsg.sender === 'doctor' ? 'Tú: ' : '') + lastMsg.text : 'Sin mensajes'}</p>
                </div>
                ${c.unread ? '<div class="unread-dot"></div>' : ''}
            `;
            container.appendChild(item);
        });
    }

    function renderActiveMessages() {
        const activeChat = chatsData.find(c => c.id === activeChatId);
        if (!activeChat) return;

        document.getElementById('activeChatName').textContent = activeChat.patient;
        document.getElementById('activeChatStatus').textContent = `En línea • Exp. #${activeChat.exp}`;
        document.getElementById('messageInput').placeholder = `Escribe tu respuesta a ${activeChat.patient}...`;

        const area = document.getElementById('messagesArea');
        area.innerHTML = '';

        activeChat.messages.forEach(m => {
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${m.sender}`;
            bubble.innerHTML = `
                ${m.text}
                <span class="message-time">${m.time}</span>
            `;
            area.appendChild(bubble);
        });

        // Desplazar al final de la conversación
        area.scrollTop = area.scrollHeight;
    }

    function selectChat(id) {
        activeChatId = id;
        const chat = chatsData.find(c => c.id === id);
        if (chat) chat.unread = false;

        saveStorage();
        renderInbox();
        renderActiveMessages();
    }

    function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const chat = chatsData.find(c => c.id === activeChatId);
        if (!chat) return;

        const now = new Date();
        const hours = now.getHours();
        const mins = now.getMinutes().toString().padStart(2, '0');
        const timeStr = `${hours % 12 || 12}:${mins} ${hours >= 12 ? 'PM' : 'AM'}`;

        chat.messages.push({
            sender: "doctor",
            text: text,
            time: timeStr
        });

        input.value = '';
        saveStorage();
        renderInbox();
        renderActiveMessages();
    }

    function useQuickReply(text) {
        document.getElementById('messageInput').value = text;
        document.getElementById('messageInput').focus();
    }

    function filterInbox() {
        const q = document.getElementById('searchInbox').value.toLowerCase();
        const filtered = chatsData.filter(c => c.patient.toLowerCase().includes(q));
        renderInbox(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderInbox();
        renderActiveMessages();
    });

</script>
<!-- MODAL CERRAR SESIÓN -->


<script>


// MENU DE LA C
</script>
</body>
</html>
