<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultas Virtuales | CliniBox</title>
<link rel="stylesheet" href="/CLINIBOX/public/assets/css/mensajes.css">

<link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3">
<script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script>
    <link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5">
    <script src="/CLINIBOX/public/assets/js/page-size.js?v=1" defer></script>
</head>
<body>
<div class="app-shell">
    <!-- BARRA LATERAL -->
    <nav class="sidebar">
        <clinibox-profile-menu data-label="Panel médico" data-profile="medico/perfil"></clinibox-profile-menu>
        <div class="nav-list">
            <a href="/CLINIBOX/public/medico/pacientes">Pacientes</a>
            <a href="/CLINIBOX/public/medico/agenda">Agenda</a>
            <a href="/CLINIBOX/public/medico/consultas">Consultas</a>
            <a href="/CLINIBOX/public/medico/expedientes">Expedientes</a>
            <a href="/CLINIBOX/public/medico/recetas">Recetas</a>
            <a href="/CLINIBOX/public/medico/mensajes" class="active">Mensajes</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <section class="section-header">
            <p class="eyebrow">Módulo médico</p>
            <h2>Consultas virtuales y mensajería</h2>
            <p>Atiende dudas de seguimiento y comunicación directa con tus pacientes.</p>
        </section>

        <!-- LAYOUT DE CHAT -->
        <div class="chat-layout">
            <!-- BANDEJA DE PACIENTES -->
            <div class="chat-inbox">
                <div class="inbox-header">
                    <input type="text" class="inbox-search" id="searchInbox" placeholder="Buscar paciente en mensajes..." oninput="filterInbox()">
                </div>
                <div class="patient-conversations-list" id="conversationsContainer">
                    <!-- Conversaciones inyectadas dinámicamente -->
                </div>
            </div>

            <!-- VENTANA DEL CHAT ACTIVO -->
            <div class="chat-window">
                <div class="chat-header">
                    <div class="chat-patient-meta">
                        <h4 id="activeChatName">Selecciona un paciente</h4>
                        <span id="activeChatStatus"></span>
                    </div>
                    <a href="expedientes.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 600;">
                        Ver Expediente &rarr;
                    </a>
                </div>

                <!-- HISTORIAL DE MENSAJES -->
                <div class="chat-messages-area" id="messagesArea">
                    <!-- Burbujas inyectadas con JavaScript -->
                </div>

                <!-- FORMULARIO DE ENVÍO -->
                <form class="chat-input-bar" onsubmit="sendMessage(event)">
                    <input type="text" id="messageInput" class="chat-input" placeholder="Escribe un mensaje…" autocomplete="off" required>
                    <button type="submit" class="btn-send">
                        <span>Enviar</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<!-- ==========================================================
     LÓGICA JAVASCRIPT: BANDEJA INTERACTIVA Y CHAT
========================================================== -->
<script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script><script>
let chatPatients=[];let chatMessages=[];let activePatientId=0;
const escChat=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function messagesFor(patientId){return chatMessages.filter(message=>Number(message.patientId)===Number(patientId));}
function renderInbox(){const query=document.getElementById('searchInbox').value.trim().toLocaleLowerCase('es-MX');const rows=chatPatients.filter(patient=>`${patient.name} ${patient.exp}`.toLocaleLowerCase('es-MX').includes(query));const container=document.getElementById('conversationsContainer');container.innerHTML=rows.map(patient=>{const last=messagesFor(patient.id).at(-1);return `<button type="button" class="conv-item ${Number(patient.id)===Number(activePatientId)?'active':''}" onclick="selectChat(${Number(patient.id)})"><span class="patient-avatar">${escChat(patient.name.split(' ').map(part=>part[0]).slice(0,2).join(''))}</span><span class="conv-info"><span class="conv-top"><strong>${escChat(patient.name)}</strong></span><span class="conv-preview">${last?escChat(last.text):'Sin mensajes'}</span></span></button>`;}).join('')||'<p style="padding:18px">No hay pacientes con citas registradas.</p>';}
function renderActiveMessages(){const patient=chatPatients.find(row=>Number(row.id)===Number(activePatientId));const area=document.getElementById('messagesArea');area.innerHTML='';document.getElementById('activeChatName').textContent=patient?.name||'Selecciona un paciente';document.getElementById('activeChatStatus').textContent=patient?`Expediente #${patient.exp}`:'';document.getElementById('messageInput').disabled=!patient;document.getElementById('messageInput').placeholder=patient?`Escribe a ${patient.name}…`:'Selecciona un paciente';if(!patient){area.textContent='Selecciona un paciente para ver los mensajes.';return;}const rows=messagesFor(patient.id);if(!rows.length){area.textContent='Todavía no hay mensajes en esta conversación.';return;}rows.forEach(message=>{const bubble=document.createElement('div');bubble.className=`message-bubble ${message.sender==='doctor'?'doctor':'patient'}`;const text=document.createElement('span');text.textContent=message.text;const time=document.createElement('span');time.className='message-time';time.textContent=new Date(message.sentAt).toLocaleString('es-MX');bubble.append(text,time);area.appendChild(bubble);});area.scrollTop=area.scrollHeight;}
function selectChat(id){activePatientId=Number(id);renderInbox();renderActiveMessages();}
function filterInbox(){renderInbox();}
async function sendMessage(event){event.preventDefault();const input=document.getElementById('messageInput');const text=input.value.trim();if(!activePatientId||!text)return;try{await clinicApi('',{action:'message',patient_id:activePatientId,text});input.value='';const data=await clinicApi('messages');chatMessages=data.messages||[];renderInbox();renderActiveMessages();}catch(error){alert(error.message);}}
(async()=>{try{const [patients,appointments,messages]=await Promise.all([clinicApi('patients'),clinicApi('appointments'),clinicApi('messages')]);const booked=new Set((appointments.appointments||[]).map(row=>Number(row.paciente_id)));chatPatients=(patients.patients||[]).filter(patient=>booked.has(Number(patient.id)));chatMessages=messages.messages||[];if(chatPatients.length)activePatientId=Number(chatPatients[0].id);renderInbox();renderActiveMessages();}catch(error){document.getElementById('conversationsContainer').textContent=error.message;}})();
</script>
<!-- MODAL CERRAR SESIÓN -->


<script>


// MENU DE LA C
</script>
</body>
</html>
