<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil médico | CliniBox</title><link rel="stylesheet" href="/CLINIBOX/public/assets/css/perfil.css"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5"><script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script></head>
<body><div class="app-shell"><nav class="sidebar"><clinibox-profile-menu data-label="Panel médico" data-profile="medico/perfil"></clinibox-profile-menu><div class="nav-list"><a href="/CLINIBOX/public/medico/pacientes">Pacientes</a><a href="/CLINIBOX/public/medico/agenda">Agenda</a><a href="/CLINIBOX/public/medico/consultas">Consultas</a><a href="/CLINIBOX/public/medico/expedientes">Expedientes</a><a href="/CLINIBOX/public/medico/recetas">Recetas</a><a href="/CLINIBOX/public/medico/mensajes">Mensajes</a></div></nav><main class="main-content"><section class="section-header"><p class="eyebrow">Módulo médico</p><h2>Mi perfil profesional</h2><p>Los datos de esta pantalla se guardan en tu cuenta.</p></section>
<section class="profile-hero-card"><div class="profile-user-left"><div class="doctor-avatar" id="avatarInitials">—</div><div class="doctor-titles"><h3 id="heroName">Cargando perfil…</h3><p id="heroSpecialty">—</p><span>Cédula profesional: <span id="heroCedula">—</span></span></div></div><button class="btn-edit-profile" type="button" onclick="openEditModal()">Editar perfil</button></section>
<section class="profile-grid"><article class="profile-field"><span>Nombre completo</span><strong id="fieldName">—</strong></article><article class="profile-field"><span>Especialidad</span><strong id="fieldSpecialty">—</strong></article><article class="profile-field"><span>Correo</span><strong id="fieldEmail">—</strong></article><article class="profile-field"><span>Teléfono</span><strong id="fieldPhone">—</strong></article><article class="profile-field"><span>Consultorio</span><strong id="fieldOffice">—</strong></article><article class="profile-field"><span>Semblanza</span><strong id="fieldBio">—</strong></article></section><p id="profileFeedback" role="status" aria-live="polite"></p>
<div class="modal-overlay" id="editModal"><div class="modal-card"><div class="modal-header"><h3>Editar perfil profesional</h3><button class="close-btn" type="button" onclick="closeModal()">&times;</button></div><form id="profileForm" onsubmit="saveProfile(event)"><div class="modal-body"><label>Nombre<input id="mName" required maxlength="160"></label><label>Cédula profesional<input id="mCedula" maxlength="40"></label><label>Especialidad<input id="mSpecialty" required maxlength="120"></label><label>Correo electrónico<input type="email" id="mEmail" required maxlength="160"></label><label>Teléfono<input id="mPhone" maxlength="30"></label><label>Consultorio<input id="mOffice" maxlength="120"></label><label>Semblanza<textarea id="mBio" rows="3"></textarea></label></div><div class="modal-footer"><button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div></form></div></div>
</main></div><script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script><script>
let profileData={};const feedback=document.getElementById('profileFeedback');
function renderProfile(){const p=profileData;document.getElementById('heroName').textContent=p.name||'—';document.getElementById('fieldName').textContent=p.name||'—';document.getElementById('heroSpecialty').textContent=p.specialty||'—';document.getElementById('fieldSpecialty').textContent=p.specialty||'—';document.getElementById('fieldEmail').textContent=p.email||'—';document.getElementById('heroCedula').textContent=p.license||'—';document.getElementById('fieldPhone').textContent=p.phone||'—';document.getElementById('fieldOffice').textContent=p.office||'—';document.getElementById('fieldBio').textContent=p.bio||'—';const initials=String(p.name||'').trim().split(/\s+/).slice(0,2).map(word=>word[0]||'').join('').toUpperCase();document.getElementById('avatarInitials').textContent=initials||'—';}
function openEditModal(){for(const [id,key] of [['mName','name'],['mCedula','license'],['mSpecialty','specialty'],['mEmail','email'],['mPhone','phone'],['mOffice','office'],['mBio','bio']])document.getElementById(id).value=profileData[key]||'';document.getElementById('editModal').classList.add('active');}
function closeModal(){document.getElementById('editModal').classList.remove('active');}
async function saveProfile(event){event.preventDefault();const payload={action:'profile',name:document.getElementById('mName').value.trim(),license:document.getElementById('mCedula').value.trim(),specialty:document.getElementById('mSpecialty').value.trim(),email:document.getElementById('mEmail').value.trim(),phone:document.getElementById('mPhone').value.trim(),office:document.getElementById('mOffice').value.trim(),bio:document.getElementById('mBio').value.trim()};try{await clinicApi('',payload);profileData={...profileData,...payload};renderProfile();closeModal();feedback.textContent='El perfil quedó guardado en la base de datos.';}catch(error){feedback.textContent=error.message;}}
(async()=>{try{const data=await clinicApi('profile');profileData=data.profile||{};renderProfile();}catch(error){document.getElementById('heroName').textContent='No se pudo cargar el perfil';feedback.textContent=error.message;}})();
</script></body></html>
