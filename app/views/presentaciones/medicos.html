<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Médicos registrados | CliniBox</title><link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5"><style>body{margin:0;background:#f5fafe;color:#15354d;font:16px system-ui,sans-serif}.page{max-width:1120px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top a,.button{color:#fff;background:#19759a;padding:10px 16px;border-radius:9px;text-decoration:none;border:0}.filters{display:flex;gap:12px;margin:24px 0}.filters input,.filters select{padding:12px;border:1px solid #bfd2de;border-radius:8px;min-width:220px}.doctor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.doctor-card{padding:20px;border:1px solid #d5e4ec;border-radius:14px;background:#fff;box-shadow:0 5px 18px #17425a0d}.doctor-card h2{margin:0 0 5px;font-size:1.2rem}.specialty{color:#19759a;font-weight:700}.doctor-card p{line-height:1.5;color:#4c6473}.empty{padding:28px;background:#fff;border-radius:12px;color:#536d7f}@media(max-width:600px){.filters{flex-direction:column}.filters input,.filters select{width:100%;box-sizing:border-box}}</style></head>
<body><main class="page"><header class="top"><div><a href="/CLINIBOX/" style="background:transparent;color:#15354d;padding-left:0">← CliniBox</a><h1>Médicos registrados</h1><p>Consulta los perfiles activos que están registrados en el sistema.</p></div><a href="/CLINIBOX/public/login?registro=1">Crear cuenta</a></header><div class="filters"><input id="doctorSearch" type="search" placeholder="Buscar médico o especialidad"><select id="specialtyFilter"><option value="">Todas las especialidades</option></select></div><p id="doctorCount" aria-live="polite">Cargando médicos…</p><section id="doctorList" class="doctor-grid"></section></main>
<script>
let registeredDoctors=[];const escDoctor=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));function renderDoctors(){const term=document.getElementById('doctorSearch').value.trim().toLocaleLowerCase('es-MX');const specialty=document.getElementById('specialtyFilter').value;const rows=registeredDoctors.filter(d=>(!specialty||d.specialty===specialty)&&`${d.name} ${d.specialty}`.toLocaleLowerCase('es-MX').includes(term));document.getElementById('doctorCount').textContent=`${rows.length} médico${rows.length===1?'':'s'}`;document.getElementById('doctorList').innerHTML=rows.map(d=>`<article class="doctor-card"><h2>${escDoctor(d.name)}</h2><div class="specialty">${escDoctor(d.specialty)}</div>${d.office?`<p>${escDoctor(d.office)}</p>`:''}${d.bio?`<p>${escDoctor(d.bio)}</p>`:''}<a class="button" href="/CLINIBOX/public/citas">Solicitar cita</a></article>`).join('')||'<div class="empty">No hay perfiles médicos registrados que coincidan con la búsqueda.</div>';}
document.getElementById('doctorSearch').addEventListener('input',renderDoctors);document.getElementById('specialtyFilter').addEventListener('change',renderDoctors);(async()=>{try{const response=await fetch('/CLINIBOX/public/api/clinica?resource=doctors',{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudo cargar la lista.');registeredDoctors=data.doctors||[];const specialties=[...new Set(registeredDoctors.map(d=>d.specialty).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));document.getElementById('specialtyFilter').innerHTML='<option value="">Todas las especialidades</option>'+specialties.map(s=>`<option>${escDoctor(s)}</option>`).join('');renderDoctors();}catch(error){document.getElementById('doctorCount').textContent='No se pudo cargar la lista';document.getElementById('doctorList').innerHTML=`<div class="empty">${escDoctor(error.message)}</div>`;}})();
</script></body></html>
