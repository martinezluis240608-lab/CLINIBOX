<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis recetas | CliniBox</title><link rel="stylesheet" href="/CLINIBOX/public/assets/css/patient-dashboard.css"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5"><script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script></head>
<body class="patient-dashboard-page"><div class="app-shell patient-shell"><aside class="patient-sidebar"><clinibox-profile-menu data-label="Portal del paciente" data-profile="paciente/perfil"></clinibox-profile-menu><nav aria-label="Navegación del paciente"><div class="nav-list"><a href="/CLINIBOX/public/paciente/inicio">Resumen del paciente</a><a href="/CLINIBOX/public/citas">Agendar cita</a><a href="/CLINIBOX/public/paciente/consultas">Citas agendadas</a><a href="/CLINIBOX/public/paciente/medicamentos">Farmacia</a><a href="/CLINIBOX/public/paciente/recetas" class="active" aria-current="page">Recetas</a><a href="/CLINIBOX/public/paciente/mensajes">Mensajes</a></div></nav></aside><main class="patient-main"><header class="patient-topbar"><h1 class="topbar-section-title">Mis recetas</h1></header><div class="pharmacy-rx-layout" id="prescriptionList"><p>Cargando recetas…</p></div></main></div>
<script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script><script>
const escRx=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const list=document.getElementById('prescriptionList');
(async()=>{try{const data=await clinicApi('prescriptions');const rows=data.prescriptions||[];list.innerHTML=rows.map(rx=>`<article class="glass-panel prescription-paper-card"><div class="rx-folio-band"><strong>Receta #RX-${String(rx.id).padStart(6,'0')}</strong><span class="status-tag ${rx.status==='activa'?'confirmed':''}">${escRx(rx.status)}</span></div><div><p><strong>Médico:</strong> ${escRx(rx.doctor)}</p><p><strong>Diagnóstico:</strong> ${escRx(rx.diagnosis||'—')}</p><p><strong>Emisión:</strong> ${escRx(rx.date)}</p></div><div class="rx-med-item" style="white-space:pre-wrap">${escRx(rx.medications||'')}</div><button type="button" class="btn btn-outline btn-sm" onclick="window.print()">Imprimir</button></article>`).join('')||'<section class="glass-panel" style="padding:24px">No tienes recetas registradas.</section>';}catch(error){list.textContent=error.message;}})();
</script></body></html>
