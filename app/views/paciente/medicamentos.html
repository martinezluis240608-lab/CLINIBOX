<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmacia | CliniBox</title><link rel="stylesheet" href="/CLINIBOX/public/assets/css/patient-dashboard.css"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5"><script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script></head>
<body class="patient-dashboard-page"><div class="app-shell patient-shell"><aside class="patient-sidebar"><clinibox-profile-menu data-label="Portal del paciente" data-profile="paciente/perfil"></clinibox-profile-menu><nav aria-label="Navegación del paciente"><div class="nav-list"><a href="/CLINIBOX/public/paciente/inicio">Resumen del paciente</a><a href="/CLINIBOX/public/citas">Agendar cita</a><a href="/CLINIBOX/public/paciente/consultas">Citas agendadas</a><a href="/CLINIBOX/public/paciente/medicamentos" class="active" aria-current="page">Farmacia</a><a href="/CLINIBOX/public/paciente/recetas">Recetas</a><a href="/CLINIBOX/public/paciente/mensajes">Mensajes</a></div></nav></aside><main class="patient-main"><header class="patient-topbar"><h1 class="topbar-section-title">Farmacia</h1></header><div class="pharmacy-rx-layout"><section class="glass-panel appointment-book-card" style="padding:24px"><h2>Catálogo disponible</h2><p>Los productos publicados aparecen después de registrarse en el inventario.</p><a class="btn btn-primary btn-sm" href="/CLINIBOX/public/tienda">Abrir tienda</a></section><section class="glass-panel" style="padding:24px"><div class="card-title-bar"><h2>Indicaciones registradas</h2><a class="btn btn-outline btn-sm" href="/CLINIBOX/public/paciente/recetas">Ver recetas</a></div><div id="activePrescriptions">Cargando indicaciones…</div></section></div></main></div>
<script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script><script>
const box=document.getElementById('activePrescriptions');const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));(async()=>{try{const data=await clinicApi('prescriptions');const rows=(data.prescriptions||[]).filter(item=>item.status==='activa');box.innerHTML=rows.map(item=>`<article class="rx-med-item"><strong>${esc(item.diagnosis||'Receta activa')}</strong><p style="white-space:pre-wrap">${esc(item.medications)}</p><small>${esc(item.doctor)} · ${esc(item.date)}</small></article>`).join('')||'<p>No hay indicaciones activas registradas.</p>';}catch(error){box.textContent=error.message;}})();
</script></body></html>
