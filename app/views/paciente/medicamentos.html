<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora de medicamentos | CliniBox</title>
<link rel="stylesheet" href="/public/assets/css/patient-dashboard.css">
</head>
<body class="patient-page">
<div class="dashboard-container">

    <div class="dashboard-header glass-panel">
        <div class="patient-profile-summary">
            <div class="patient-avatar-badge">👨‍💼</div>
            <div>
                <h2>Bitácora de medicamentos</h2>
                <span class="patient-id-badge">Carlos Mendoza • Paciente</span>
            </div>
        </div>
        <div class="dashboard-header-actions">
            <a class="btn btn-outline btn-sm" href="../"><span>🏠 Regresar al Paseo Virtual</span></a>
            <a class="btn btn-danger btn-sm" href="../"><span>Cerrar sesión</span></a>
        </div>
    </div>

    <nav class="patient-tabs" aria-label="Secciones del panel paciente">
        <a href="inicio">Inicio</a>
        <a href="consultas">Consultas</a>
        <a href="medicamentos" class="active">Medicamentos</a>
        <a href="mensajes">Mensajes</a>
        <a href="recetas">Recetas</a>
        <a href="agendarCita">Agendar cita</a>
        <a href="perfil">Perfil</a>
    </nav>

    <div class="dashboard-grid">
        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-icon">💊</span>
                <h3>Losartán 50mg</h3>
            </div>
            <div class="dash-card-body">
                <p><strong>08:00 AM</strong> — Tomar con alimentos</p>
                <span class="badge-status-confirmed">Tomado</span>
            </div>
        </div>

        <div class="dash-card">
            <div class="dash-card-header">
                <span class="dash-icon">💊</span>
                <h3>Losartán 50mg</h3>
            </div>
            <div class="dash-card-body">
                <p><strong>08:00 PM</strong> — Sin notas</p>
                <span class="badge-status-pendiente">Pendiente</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
