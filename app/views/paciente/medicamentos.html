<html lang="es">
<head>

</head>
<body>
<div class="app-shell">
    <nav class="sidebar">
        <div class="brand">
            <div class="brand-mark">C</div>

        </div>
        <div class="nav-list">
            <a href="consultas">Consultas</a>
            <a href="medicamentos" class="active">Medicamentos</a>

                    <tr><td>Losartán 50mg</td><td>08:00 AM</td><td><span class="pill">Sí</span></td><td>Tomar con alimentos</td></tr>
