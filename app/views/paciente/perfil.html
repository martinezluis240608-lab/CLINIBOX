<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | CliniBox</title><link rel="stylesheet" href="/CLINIBOX/public/assets/css/patient-dashboard.css"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/perfil.css"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/profile-menu.css?v=3"><link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5"><script src="/CLINIBOX/public/assets/js/profile-menu.js?v=2" defer></script></head>
<body class="patient-dashboard-page"><div class="app-shell patient-shell"><aside class="patient-sidebar"><clinibox-profile-menu data-label="Portal del paciente" data-profile="paciente/perfil"></clinibox-profile-menu><nav aria-label="Navegación del paciente"><div class="nav-list"><a href="/CLINIBOX/public/paciente/inicio">Resumen del paciente</a><a href="/CLINIBOX/public/citas">Agendar cita</a><a href="/CLINIBOX/public/paciente/consultas">Citas agendadas</a><a href="/CLINIBOX/public/paciente/medicamentos">Farmacia</a><a href="/CLINIBOX/public/paciente/recetas">Recetas</a><a href="/CLINIBOX/public/paciente/mensajes">Mensajes</a></div></nav></aside><main class="patient-main"><header class="patient-topbar"><h1 class="topbar-section-title">Mi perfil</h1></header>
<section class="glass-panel" style="padding:24px;max-width:850px"><div class="card-title-bar"><h2 id="profileName">Cargando cuenta…</h2><button class="btn btn-primary btn-sm" type="button" onclick="abrirModalEditarPerfil()">Editar datos</button></div><dl class="profile-data-list"><div class="profile-field-box"><dt>Correo electrónico</dt><dd id="lblEmail">—</dd></div><div class="profile-field-box"><dt>Teléfono</dt><dd id="lblTelefono">—</dd></div><div class="profile-field-box"><dt>Dirección</dt><dd id="lblDireccion">—</dd></div><div class="profile-field-box"><dt>Contacto de emergencia</dt><dd id="lblContactoEmergenciaNombre">—</dd><dd id="lblContactoEmergenciaParentesco"></dd><dd id="lblContactoEmergenciaTel"></dd></div></dl><a id="lnkLlamarEmergencia" class="btn btn-outline btn-sm" hidden>Llamar al contacto</a><p id="profileFeedback" role="status" aria-live="polite"></p></section>
<div class="modal-overlay" id="modalEditarPerfil" role="dialog" aria-modal="true" aria-labelledby="profileEditTitle"><div class="modal-card"><div class="modal-header"><h2 id="profileEditTitle">Actualizar mis datos</h2><button class="close-btn" type="button" onclick="cerrarModalEditarPerfil()">&times;</button></div><form id="profileForm" onsubmit="guardarEdicionPerfil(event)"><div class="modal-body"><label>Nombre<input id="txtNombre" type="text" readonly></label><label>Correo electrónico<input id="txtEmail" type="email" required></label><label>Teléfono<input id="txtTel" type="tel"></label><label>Dirección<input id="txtDireccion" type="text"></label><h3>Contacto de emergencia</h3><label>Nombre<input id="txtEmergenciaNombre" type="text"></label><label>Teléfono<input id="txtEmergenciaTel" type="tel"></label><label>Parentesco<select id="txtEmergenciaParentesco"><option value="">Selecciona parentesco</option><option value="Madre / Padre">Madre o padre</option><option value="Hijo / Hija">Hijo o hija</option><option value="Hermano / Hermana">Hermano o hermana</option><option value="Pareja">Pareja</option><option value="Familiar">Familiar</option><option value="Amigo / Tutor">Amigo o tutor</option></select></label></div><div class="modal-footer"><button class="btn btn-outline" type="button" onclick="cerrarModalEditarPerfil()">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div></form></div></div>
</main></div>
<script src="/CLINIBOX/public/assets/js/clinic-api.js?v=1"></script><script>
let patientProfile={};const feedback=document.getElementById('profileFeedback');
function mostrarDato(id,value){document.getElementById(id).textContent=String(value||'—');}
function cargarDatosPerfil(){mostrarDato('profileName',patientProfile.name);mostrarDato('lblEmail',patientProfile.email);mostrarDato('lblTelefono',patientProfile.phone);mostrarDato('lblDireccion',patientProfile.address);mostrarDato('lblContactoEmergenciaNombre',patientProfile.emergency_name);mostrarDato('lblContactoEmergenciaParentesco',patientProfile.emergency_relationship);mostrarDato('lblContactoEmergenciaTel',patientProfile.emergency_phone);const link=document.getElementById('lnkLlamarEmergencia');if(patientProfile.emergency_phone){link.href='tel:'+String(patientProfile.emergency_phone).replace(/[^0-9+]/g,'');link.hidden=false;}else link.hidden=true;document.getElementById('txtNombre').value=patientProfile.name||'';document.getElementById('txtEmail').value=patientProfile.email||'';document.getElementById('txtTel').value=patientProfile.phone||'';document.getElementById('txtDireccion').value=patientProfile.address||'';document.getElementById('txtEmergenciaNombre').value=patientProfile.emergency_name||'';document.getElementById('txtEmergenciaTel').value=patientProfile.emergency_phone||'';document.getElementById('txtEmergenciaParentesco').value=patientProfile.emergency_relationship||'';}
function abrirModalEditarPerfil(){cargarDatosPerfil();document.getElementById('modalEditarPerfil').classList.add('active');}
function cerrarModalEditarPerfil(){document.getElementById('modalEditarPerfil').classList.remove('active');}
async function guardarEdicionPerfil(event){event.preventDefault();const payload={action:'profile',name:patientProfile.name,email:document.getElementById('txtEmail').value.trim(),phone:document.getElementById('txtTel').value.trim(),address:document.getElementById('txtDireccion').value.trim(),emergency_name:document.getElementById('txtEmergenciaNombre').value.trim(),emergency_phone:document.getElementById('txtEmergenciaTel').value.trim(),emergency_relationship:document.getElementById('txtEmergenciaParentesco').value};try{await clinicApi('',payload);patientProfile={...patientProfile,email:payload.email,phone:payload.phone,address:payload.address,emergency_name:payload.emergency_name,emergency_phone:payload.emergency_phone,emergency_relationship:payload.emergency_relationship};cargarDatosPerfil();cerrarModalEditarPerfil();feedback.textContent='Los datos se guardaron en tu cuenta.';}catch(error){feedback.textContent=error.message;}}
(async()=>{try{const data=await clinicApi('profile');patientProfile=data.profile||{};cargarDatosPerfil();}catch(error){mostrarDato('profileName','No se pudo cargar el perfil');feedback.textContent=error.message;}})();
</script></body></html>
