<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/CLINIBOX/CLINIBOX/public/">
    <title>Configuración inicial | CliniBox</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/administador_tienda.css?v=20261123.1">
    <script src="assets/js/administador_tienda.js?v=20261123.2" defer></script>
</head>
<body class="admin-setup-page" data-admin-page="setup">
<main class="admin-setup-card">
    <a class="admin-setup-brand" href="./"><span class="brand-mark">C</span><strong>CliniBox</strong></a>
    <p class="eyebrow">Configuración inicial</p>
    <h1>Crear la cuenta administradora</h1>
    <p>Este formulario solo está disponible mientras no exista un administrador activo.</p>
    <div class="admin-alert alert-error" role="alert" data-feedback hidden></div>
    <form class="admin-form-grid admin-setup-form" action="admin/configurar" method="post">
        <input type="hidden" name="csrf_token" data-csrf-token>
        <label class="admin-field"><span>Nombre completo <i>*</i></span><input name="nombre" maxlength="120" autocomplete="name" placeholder="Nombre y apellido" required></label>
        <label class="admin-field"><span>Correo electrónico <i>*</i></span><input type="email" name="email" maxlength="160" autocomplete="email" placeholder="nombre@clinibox.com" required></label>
        <label class="admin-field"><span>Contraseña <i>*</i></span><input type="password" name="password" minlength="12" autocomplete="new-password" placeholder="Mínimo 12 caracteres" required></label>
        <label class="admin-field"><span>Confirmar contraseña <i>*</i></span><input type="password" name="confirmar_password" minlength="12" autocomplete="new-password" required></label>
        <button class="admin-button" type="submit">Crear administrador inicial <span aria-hidden="true">→</span></button>
    </form>
</main>
</body>
</html>
