<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CliniBox | Producto</title>
	<link rel="stylesheet" href="/CLINIBOX/public/assets/css/tienda.css?v=20261112.1">
	<style>
		.product-page { min-height: calc(100vh - 100px); padding: 38px 24px 70px; }
		.product-container { width: min(1200px, 100%); margin: 0 auto; }
		.product-detail { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(0, 1.1fr); gap: 34px; padding: 30px; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--glass); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
		.product-image { min-height: 360px; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.8); border-radius: var(--radius-lg); background: linear-gradient(145deg, rgba(184,245,255,.5), rgba(255,255,255,.64)); }
		.product-image span { font-size: 96px; filter: drop-shadow(0 12px 18px rgba(4,68,118,.15)); }
		.product-information { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; color: var(--text); }
		.product-information small { color: var(--blue-dark); font-size: 12px; font-weight: 800; text-transform: uppercase; }
		.product-information h1 { margin: 9px 0 0; color: var(--navy); font-size: 32px; line-height: 1.2; overflow-wrap: anywhere; }
		.product-price { margin: 18px 0 10px; color: var(--blue-dark); font-size: 28px; font-weight: 800; }
		.product-description { color: var(--text-soft); line-height: 1.65; }
		.product-features { width: 100%; margin-top: 22px; }
		.product-features h3 { margin-bottom: 4px; color: var(--navy); font-size: 16px; }
		.product-feature { display: flex; justify-content: space-between; gap: 18px; padding: 11px 0; border-bottom: 1px solid rgba(8,43,85,.12); color: var(--text-soft); }
		.product-feature strong { color: var(--navy); text-align: right; }
		.product-option { width: 100%; margin-top: 20px; }
		.product-option label { display: block; margin-bottom: 8px; color: var(--navy); font-size: 13px; font-weight: 700; }
		.product-option input { width: 100%; min-height: 44px; padding: 10px 13px; border: 1px solid rgba(8,43,85,.16); border-radius: var(--radius-sm); background: rgba(255,255,255,.78); color: var(--text); font-size: 16px; }
		.product-add { width: 100%; min-height: 48px; margin-top: 20px; padding: 12px 17px; border: 0; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--blue), var(--blue-light)); box-shadow: var(--shadow-soft); color: white; cursor: pointer; font-size: 14px; font-weight: 800; transition: var(--transition); }
		.product-add:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
		.product-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--blue-dark); font-size: 13px; font-weight: 700; }
		.product-back:hover { color: var(--blue); }
		.product-back svg { width: 17px; height: 17px; }
		.product-not-found { grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-soft); }
		.product-not-found h2 { margin-bottom: 16px; color: var(--navy); }
		.product-not-found a { color: var(--blue-dark); font-weight: 700; }
		@media (max-width: 800px) { .product-detail { grid-template-columns: 1fr; gap: 24px; padding: 20px; } .product-image { min-height: 280px; } }
		@media (max-width: 480px) { .product-page { padding: 24px 15px 45px; } .product-detail { gap: 18px; padding: 15px; } .product-image { min-height: 220px; } .product-image span { font-size: 76px; } .product-information h1 { font-size: 25px; } .product-price { font-size: 24px; } }
	</style>
    <link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5">
    <script src="/CLINIBOX/public/assets/js/page-size.js?v=1" defer></script>
</head>
<body>
	<div class="shop-background"></div>
	<div class="shop-background-overlay"></div>
	<header class="shop-header">
		<div class="shop-header-inner">
			<a href="/CLINIBOX/public/tienda" class="shop-logo">
				<div class="shop-logo-icon"><i data-lucide="heart-pulse"></i></div>
				<div class="shop-logo-text"><span>Clini</span>Box</div>
			</a>
			<div class="shop-actions">
				<a href="/CLINIBOX/public/favoritos" class="shop-circle-button" title="Favoritos" aria-label="Favoritos"><i data-lucide="heart"></i></a>
				<a href="/CLINIBOX/public/carrito" class="shop-circle-button cart-button" title="Carrito" aria-label="Carrito"><i data-lucide="shopping-cart"></i><span class="cart-badge" id="cartCount">0</span></a>
				<a href="/CLINIBOX/public/login" class="shop-circle-button" title="Mi cuenta" aria-label="Mi cuenta"><i data-lucide="user-round"></i></a>
			</div>
		</div>
	</header>

	<main class="product-page">
		<div class="product-container">
			<a href="/CLINIBOX/public/tienda" class="product-back"><i data-lucide="arrow-left"></i> Volver a la tienda</a>
			<div id="productDetail" class="product-detail"></div>
		</div>
	</main>

	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="/CLINIBOX/public/assets/js/carrito.js?v=db-catalog-1"></script>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			const productId = Number(params.get('id'));
			const container = document.getElementById('productDetail');
			const apiUrl = '/CLINIBOX/public/api/farmacia?resource=products';
			function escapeHtml(value) {
				return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
					return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character];
				});
			}
			function notFound(message) {
				container.innerHTML = '<div class="product-not-found"><h2>' + escapeHtml(message) + '</h2><a href="/CLINIBOX/public/tienda">Volver a la tienda</a></div>';
			}
			if (!Number.isInteger(productId) || productId < 1) {
				notFound('Producto no encontrado');
				return;
			}
			fetch(apiUrl, { credentials: 'same-origin', cache: 'no-store' })
				.then(function (response) {
					if (!response.ok) throw new Error('No se pudo consultar el producto.');
					return response.json();
				})
				.then(function (data) {
					const product = (data.products || []).find(function (item) { return Number(item.id) === productId; });
					if (!product) {
						notFound('Producto no disponible');
						return;
					}
					const stock = Number(product.stock || 0);
					const available = stock > 0;
					const price = Number(product.price || 0);
					container.innerHTML = '<div class="product-image"><span>' + escapeHtml(product.emoji || '💊') + '</span></div>' +
						'<div class="product-information"><small>' + escapeHtml(product.category || '') + '</small>' +
						'<h1>' + escapeHtml(product.name) + '</h1>' +
						'<div class="product-price">' + price.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' }) + '</div>' +
						'<p class="product-description">' + escapeHtml(product.description || 'Sin descripción registrada.') + '</p>' +
						'<div class="product-features"><h3>Disponibilidad</h3><div class="product-feature"><span>Existencias</span><strong>' + (available ? stock : 'Agotado') + '</strong></div>' +
						'<div class="product-feature"><span>Código de barras</span><strong>' + escapeHtml(product.barcode || 'No registrado') + '</strong></div></div>' +
						'<div class="product-option"><label for="cantidadProducto">Cantidad</label><input id="cantidadProducto" type="number" min="1" max="' + stock + '" value="1" ' + (available ? '' : 'disabled') + '></div>' +
						'<button class="product-add" id="btnAgregarProducto" type="button" ' + (available ? '' : 'disabled') + '>' + (available ? 'AGREGAR AL CARRITO' : 'AGOTADO') + '</button></div>';
					const button = document.getElementById('btnAgregarProducto');
					if (available) button.addEventListener('click', function () {
						const input = document.getElementById('cantidadProducto');
						const quantity = Math.max(1, Math.min(stock, Number(input.value) || 1));
						window.cliniboxCart.add({
							id: Number(product.id), name: product.name, category: product.category,
							price: price, oldPrice: price, emoji: product.emoji || '💊',
							barcode: product.barcode, quantity: quantity
						});
						alert('Producto agregado al carrito.');
					});
					if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
				})
				.catch(function () { notFound('No se pudo cargar el producto'); });
		})();
	</script>
</body>
</html>
