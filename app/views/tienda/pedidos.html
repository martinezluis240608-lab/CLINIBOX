<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CliniBox | Mis pedidos</title>
    <link rel="stylesheet" href="/CLINIBOX/public/assets/css/tienda.css?v=20261112.1">
    <style>
        .orders-page { min-height: 100vh; padding: 55px 0 80px; background: #f7f9fc; }
        .orders-container { width: min(1100px, 90%); margin: auto; }
        .orders-heading h1 { font-size: 38px; }
        .orders-heading p { color: #718096; }
        .order-card { margin-top: 20px; padding: 25px; border: 1px solid #e5ebf2; border-radius: 22px; background: white; }
        .order-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1px solid #edf1f5; }
        .order-status { padding: 7px 13px; border-radius: 20px; background: #eaf7ef; color: #23844b; font-size: 13px; font-weight: 700; }
        .order-product { display: flex; justify-content: space-between; padding: 15px 0; }
        .order-total { text-align: right; font-size: 20px; font-weight: 800; }
        .orders-empty { margin-top: 30px; padding: 70px 20px; text-align: center; background: white; border-radius: 22px; }
        .orders-empty a { display: inline-block; margin-top: 20px; padding: 12px 18px; border-radius: 10px; background: #2563eb; color: white; }
    </style>
    <link rel="stylesheet" href="/CLINIBOX/public/assets/css/clinibox.css?v=5">
    <script src="/CLINIBOX/public/assets/js/page-size.js?v=1" defer></script>
</head>
<body>
    <header class="store-header"><div class="store-container header-content">
        <a href="/CLINIBOX/public/tienda" class="store-logo"><div class="store-logo-icon"><i data-lucide="heart-pulse"></i></div><div class="store-logo-text"><span>Clini</span>Box</div></a>
        <nav class="store-navigation"><a href="/CLINIBOX/public/tienda">Tienda</a><a href="/CLINIBOX/public/favoritos">Favoritos</a><a class="active" href="/CLINIBOX/public/pedidos">Mis pedidos</a><a href="/CLINIBOX/public/ayuda">Ayuda</a></nav>
        <div class="store-actions"><a href="/CLINIBOX/public/favoritos" class="store-icon-button"><i data-lucide="heart"></i></a><a href="/CLINIBOX/public/carrito" target="_blank" class="store-icon-button"><i data-lucide="shopping-cart"></i></a><a href="/CLINIBOX/public/login" class="store-account"><i data-lucide="user-round"></i></a></div>
    </div></header>
    <main class="orders-page"><div class="orders-container"><div class="orders-heading"><h1>Mis pedidos</h1><p>Consulta el estado y los detalles de tus compras.</p></div><div id="ordersContainer"></div></div></main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        const statusLabels = { recibido: "Recibido por farmacia", preparando: "Preparando tu pedido", listo: "Listo para recoger", enviado: "Enviado", en_transito: "En tránsito", entregado: "Entregado", verificado: "Entrega confirmada", cancelado: "Cancelado" };
        const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
        const money = value => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(Number(value) || 0);
        const contenedor = document.getElementById("ordersContainer");
        const folio = new URLSearchParams(location.search).get("folio");
        let refs = [];
        try { refs = JSON.parse(localStorage.getItem("cliniboxOrderRefs") || "[]"); } catch (_) {}
        if (folio) refs = refs.filter(ref => ref.id === folio);
        const empty = '<div class="orders-empty"><i data-lucide="package-open" style="width:60px;height:60px"></i><h2>Todavía no tienes pedidos</h2><p>Al confirmar una compra, podrás revisar aquí su preparación, envío y entrega.</p><a href="/CLINIBOX/public/tienda">Ir a la tienda</a></div>';
        if (!refs.length) contenedor.innerHTML = empty;
        else Promise.all(refs.map(async ref => {
            const response = await fetch(`/CLINIBOX/public/api/farmacia?resource=tracking&id=${encodeURIComponent(ref.id)}&token=${encodeURIComponent(ref.token)}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "No se pudo consultar el pedido.");
            return data.order;
        })).then(orders => {
            contenedor.innerHTML = orders.map(order => {
                const lines = (order.items || []).map(item => `<div class="order-product"><span>${escapeHtml(item.name)} × ${Number(item.quantity)}</span><strong>${money(item.total)}</strong></div>`).join("");
                const tracking = order.delivery_type === "recoger" ? "Recoge tu pedido en la farmacia." : `${order.carrier ? escapeHtml(order.carrier) : "Envío por asignar"}${order.tracking_number ? ` · Guía ${escapeHtml(order.tracking_number)}` : ""}`;
                const history = (order.history || []).map(step => `<span class="order-timeline-step"><i></i><span><strong>${escapeHtml(statusLabels[step.status] || step.status)}</strong><small>${new Date(step.at).toLocaleString("es-MX")}${step.note ? ` · ${escapeHtml(step.note)}` : ""}</small></span></span>`).join("");
                return `<article class="order-card"><div class="order-header"><div><strong>${escapeHtml(order.id)}</strong><br><small>${new Date(order.created_at).toLocaleString("es-MX")}</small></div><span class="order-status">${escapeHtml(statusLabels[order.status] || order.status)}</span></div>${lines}<div class="order-delivery"><strong>${order.delivery_type === "recoger" ? "Recolección" : "Entrega"}</strong><span>${escapeHtml(order.destination || "Mostrador de farmacia")}</span><small>${tracking}</small></div><div class="order-timeline">${history}</div><div class="order-total">Total: ${money(order.total)}</div></article>`;
            }).join("");
            if (typeof lucide !== "undefined") lucide.createIcons();
        }).catch(error => { contenedor.innerHTML = `<div class="orders-empty"><h2>No se pudo cargar el seguimiento</h2><p>${escapeHtml(error.message)}</p><a href="/CLINIBOX/public/tienda">Volver a la tienda</a></div>`; });
        if (typeof lucide !== "undefined") lucide.createIcons();
    </script>
</body>
</html>
