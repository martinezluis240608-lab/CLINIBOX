<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CliniBox | Carrito</title>
	<link rel="stylesheet" href="/CLINIBOX/CLINIBOX/public/assets/css/tienda.css">
	<style>
		.cart-page { min-height: 100vh; padding: 55px 0 80px; background: #f7f9fc; }
		.cart-container { width: min(1100px, 90%); margin: auto; }
		#cartContent { display: grid; grid-template-columns: 1fr 300px; gap: 25px; }
		.cart-products, .cart-summary, .cart-empty { padding: 25px; border: 1px solid #e5ebf2; border-radius: 20px; background: white; }
		.cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 18px; padding: 15px 0; border-bottom: 1px solid #edf1f5; }
		.cart-item-image { display: grid; place-items: center; min-height: 70px; border-radius: 12px; background: #f5f8fc; }
		.cart-item h3 { margin: 5px 0; }
		.cart-price { font-weight: 800; }
		.cart-remove { margin-top: 8px; border: 0; background: transparent; color: #dc2626; cursor: pointer; }
		.summary-row { display: flex; justify-content: space-between; padding: 10px 0; }
		.summary-total { margin-top: 10px; border-top: 1px solid #edf1f5; font-size: 1.2rem; font-weight: 800; }
		.checkout-button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; font-weight: 700; }
		.cart-empty { grid-column: 1 / -1; text-align: center; }
		@media (max-width: 750px) { #cartContent { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<header class="store-header"><div class="store-container header-content"><a href="/CLINIBOX/CLINIBOX/public/tienda" class="store-logo"><div class="store-logo-icon"><i data-lucide="heart-pulse"></i></div><div class="store-logo-text"><span>Clini</span>Box</div></a><nav class="store-navigation"><a href="/CLINIBOX/CLINIBOX/public/tienda">Tienda</a><a href="/CLINIBOX/CLINIBOX/public/favoritos">Favoritos</a><a class="active" href="/CLINIBOX/CLINIBOX/public/carrito">Carrito</a></nav><div class="store-actions"><a href="/CLINIBOX/CLINIBOX/public/favoritos" class="store-icon-button"><i data-lucide="heart"></i></a><a href="/CLINIBOX/CLINIBOX/public/login" class="store-account"><i data-lucide="user-round"></i></a></div></div></header>
	<main class="cart-page"><div class="cart-container"><h1>Mi carrito</h1><p>Configura tus productos antes de continuar con la compra.</p><div id="cartContent"></div></div></main>
	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="/CLINIBOX/CLINIBOX/public/assets/js/carrito.js"></script>
	<script>document.addEventListener("DOMContentLoaded", () => { actualizarContadorCarrito(); renderizarCarrito(); lucide.createIcons(); });</script>
</body>
</html>
